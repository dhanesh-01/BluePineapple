<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn how to show and hide elements using JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outer-div">
        <button onclick="show()">Show Modal</button>

        <div id="inner" class="inner-div" style="display: none;">
            <button id="close">Close</button>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
