<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Table Exercise</title>
    <link rel="stylesheet" href="table2.css">
</head>
<body>

    <h2>HTML Table Exercise</h2>

    <table>
        <tr>
            <th rowspan="2">Day</th>
            <th colspan="2">Seminar</th>
            <th rowspan="2">Topic</th>
        </tr>
        <tr>
            <th>Begin</th>
            <th>End</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td class="yellow">8:00 am</td>
            <td class="pink">5:00 pm</td>
            <td>Introduction to XML</td>
        </tr>
        <tr>
            <td class="yellow">8:00 am</td>
            <td class="pink">5:00 pm</td>
            <td>Validity: DTD and Relax NG</td>
        </tr>
        <tr>
            <td rowspan="3">Tuesday</td>
            <td class="yellow">8:00 am</td>
            <td class="yellow">11:00 am</td>
            <td>XPath</td>
        </tr>
        <tr>
            <td class="yellow">11:00 am</td>
            <td class="green">2:00 pm</td>
            <td rowspan="2">XSL Transformations</td>
        </tr>
        <tr>
            <td class="green">2:00 pm</td>
            <td class="pink">5:00 pm</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td class="yellow">8:00 am</td>
            <td class="green">12:00 pm</td>
            <td>XSL Formatting Objects</td>
        </tr>
    </table>

</body>
</html>
