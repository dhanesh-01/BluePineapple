<!DOCTYPE html>
<html >
<head>
    <title>Tables & Forms Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 class="title">Employee Details</h2>
    <table class="employee-table">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Dhanesh Sakhala</td>
            <td>Cloud Analyst</td>
            <td>dhanesh@gmail.com</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Pranav Jangam</td>
            <td>HR</td>
            <td>pranav@gmail.com</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Vaibhav Mungel</td>
            <td>Testing</td>
            <td>vaibhav@gmail.com</td>
        </tr>
    </table>

    <h2 class="title">Registration Form</h2>

    <form class="register-form">
        <label>Name</label>
        <input type="text" class="input-field" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" class="input-field" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" class="input-field" placeholder="Enter password">

        <button class="submit-btn">Register</button>
    </form>

</body>
</html>
